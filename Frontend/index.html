
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySprint | Student Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 StudySprint</h1>
        <p>Plan your tasks. Track your progress. Achieve your goals!</p>
    </header>

    <main>
        <section class="summary">
            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>
            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
        </section>

        <section class="task-form">
            <h2>Add a Study Task</h2>
            <form id="taskForm">
                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    required
                >
                <input type="date" id="taskDeadline" required>
                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="task-list">
            <h2>My Tasks</h2>
            <div id="tasksContainer">
                <p>No tasks yet. Add your first task!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>StudySprint © 2026 | Learn. Plan. Achieve.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
